name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - phase-1/mvp-foundation
  push:
    branches:
      - feature/ai-content-factory

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run dist:win
      - name: Smoke test packaged Windows app
        shell: powershell
        run: |\n          $exe = Get-ChildItem -Path release\\win-unpacked -Filter *.exe | Select-Object -First 1\n          if (-not $exe) { throw "Packaged app executable not found" }\n          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru\n          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Packaged app smoke test timed out" }\n          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed with exit code $($process.ExitCode)" }\n      - uses: actions/upload-artifact@v4
        with:
          name: gananajak-ai-video-editor-windows
          path: |
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
