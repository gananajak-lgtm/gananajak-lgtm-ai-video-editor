name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - phase-1/mvp-foundation
  push:
    branches:
      - feature/ai-content-factory

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run dist:win
      - name: Smoke test packaged Windows app
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path release\\win-unpacked -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Packaged app executable not found" }
          $smokeMarker = Join-Path $env:RUNNER_TEMP "gananajak-packaged-smoke\\frame.png"
          if (Test-Path $smokeMarker) { Remove-Item $smokeMarker -Force }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru
          Start-Sleep -Seconds 15
          if (-not (Test-Path $smokeMarker)) {
            if (-not $process.HasExited) { $process.Kill() }
            throw "Packaged app smoke marker was not created"
          }
          if (-not $process.HasExited) { $process.Kill() }
          Write-Host "Packaged app launched and bundled FFmpeg created $smokeMarker"
      - uses: actions/upload-artifact@v4
        with:
          name: gananajak-ai-video-editor-windows
          path: |
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
