name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - phase-1/mvp-foundation
  push:
    branches:
      - feature/ai-content-factory

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:content
      - run: npm run dist:win
      - name: Verify packaged Windows runtime
        shell: powershell
        run: |
          $appRoot = "release\\win-unpacked"
          $exe = Join-Path $appRoot "Gananajak AI Video Editor.exe"
          $ffmpeg = Join-Path $appRoot "resources\\app.asar.unpacked\\node_modules\\ffmpeg-static\\ffmpeg.exe"
          if (-not (Test-Path $exe)) { throw "Packaged app executable not found: $exe" }
          if (-not (Test-Path $ffmpeg)) { throw "Bundled FFmpeg not found: $ffmpeg" }
          $frame = Join-Path $env:RUNNER_TEMP "gananajak-packaged-frame.png"
          & $ffmpeg -y -f lavfi -i "color=c=0x182033:s=320x568:r=30" -frames:v 1 $frame
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg smoke test failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $frame)) { throw "Bundled FFmpeg did not create smoke frame" }
          Write-Host "Packaged executable and bundled FFmpeg verified."
      - uses: actions/upload-artifact@v4
        with:
          name: gananajak-ai-video-editor-windows
          path: |
            release/*.exe
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14
